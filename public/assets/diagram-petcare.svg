<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none">
  <rect width="960" height="480" rx="16" fill="#0d1219"/>
  <rect x="1" y="1" width="958" height="478" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Title & Metadata -->
  <text x="40" y="44" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">MICROSERVICES ARCHITECTURE</text>
  <text x="40" y="68" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600">Cloud-Native Spring Boot Microservices Platform — Inter-Service Security &amp; Multi-DB</text>

  <!-- Flow Lines -->
  <g stroke="#00d6a0" stroke-width="2" opacity="0.35" stroke-dasharray="4 4">
    <line x1="150" y1="210" x2="230" y2="210"/>
    <line x1="370" y1="210" x2="450" y2="150"/>
    <line x1="370" y1="210" x2="450" y2="250"/>
    <line x1="370" y1="210" x2="450" y2="340"/>
    <line x1="630" y1="150" x2="720" y2="150"/>
    <line x1="630" y1="250" x2="720" y2="250"/>
    <line x1="630" y1="340" x2="720" y2="340"/>
  </g>

  <!-- Client -->
  <g transform="translate(40, 150)">
    <rect width="110" height="130" rx="12" fill="#141c26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="55" y="24" fill="#8e9aaa" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="600">CLIENTS</text>
    <rect x="20" y="44" width="70" height="26" rx="6" fill="#1b2533"/>
    <text x="55" y="61" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">React Web</text>
    <rect x="20" y="80" width="70" height="26" rx="6" fill="#1b2533"/>
    <text x="55" y="97" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Mobile App</text>
  </g>

  <!-- Spring Cloud Gateway -->
  <g transform="translate(210, 130)">
    <rect width="160" height="170" rx="12" fill="#141c26" stroke="#00d6a0" stroke-width="1.8"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="rgba(0,214,160,0.12)"/>
    <text x="80" y="22" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">SPRING CLOUD GATEWAY</text>
    <text x="80" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Reverse Proxy &amp; Auth</text>
    <text x="80" y="88" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Spring Security + JWT</text>
    <text x="80" y="108" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Circuit Breaker (Resilience4j)</text>
    <text x="80" y="128" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Eureka Service Discovery</text>
    <text x="80" y="148" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SSL / CORS Security</text>
  </g>

  <!-- Microservice 1: Pet Tracking -->
  <g transform="translate(450, 100)">
    <rect width="180" height="85" rx="10" fill="#182330" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="90" y="24" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">TRACKING MICROSERVICE</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Telemetry &amp; Geo-Tracking</text>
    <text x="90" y="66" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">Spring Boot · REST &amp; WebSockets</text>
  </g>

  <!-- Microservice 2: Medical & Care -->
  <g transform="translate(450, 205)">
    <rect width="180" height="85" rx="10" fill="#182330" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="90" y="24" fill="#ff9f45" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">PET CARE &amp; RECORDS</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Vaccines, Appointments &amp; Diet</text>
    <text x="90" y="66" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">Spring Data JPA · Hibernate</text>
  </g>

  <!-- Microservice 3: User & Auth -->
  <g transform="translate(450, 310)">
    <rect width="180" height="85" rx="10" fill="#182330" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="90" y="24" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">USER &amp; NOTIFICATIONS</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Accounts, RBAC &amp; Alerts</text>
    <text x="90" y="66" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">Spring Security · Third-Party API</text>
  </g>

  <!-- DB Layer -->
  <g transform="translate(710, 100)">
    <!-- MongoDB -->
    <rect width="180" height="85" rx="10" fill="#141c26" stroke="#00d6a0" stroke-width="1.5"/>
    <text x="90" y="24" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">MONGODB</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Time-Series Telemetry</text>
    <text x="90" y="66" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">High-throughput NoSQL</text>
  </g>

  <g transform="translate(710, 205)">
    <!-- MySQL -->
    <rect width="180" height="85" rx="10" fill="#141c26" stroke="#ff9f45" stroke-width="1.5"/>
    <text x="90" y="24" fill="#ff9f45" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">MYSQL RELATIONAL DB</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Transactional Health Records</text>
    <text x="90" y="66" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">ACID &amp; Foreign Key Constraints</text>
  </g>

  <g transform="translate(710, 310)">
    <!-- Docker Deployment -->
    <rect width="180" height="85" rx="10" fill="#141c26" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="90" y="24" fill="#8e9aaa" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">DOCKER ORCHESTRATION</text>
    <text x="90" y="46" fill="#edeff3" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Isolated Containers</text>
    <text x="90" y="66" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">Linux VPS Deployments</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="415" width="880" height="42" rx="8" fill="#10151d" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="441" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="11">Architecture Focus:</text>
  <text x="180" y="441" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Clean separation of concerns, independent microservice scaling, resilient JWT authentication, and hybrid relational + NoSQL data persistence.</text>
</svg>
