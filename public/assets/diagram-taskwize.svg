<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none">
  <rect width="960" height="480" rx="16" fill="#0d1219"/>
  <rect x="1" y="1" width="958" height="478" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Title & Metadata -->
  <text x="40" y="44" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">MOBILE &amp; AI ARCHITECTURE</text>
  <text x="40" y="68" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600">TaskWize — Real-time Firestore Sync, Geofence Triggers &amp; AI Task Prioritization</text>

  <!-- Connectors -->
  <g stroke="#00d6a0" stroke-width="2" opacity="0.35" stroke-dasharray="4 4">
    <line x1="200" y1="230" x2="280" y2="230"/>
    <line x1="440" y1="230" x2="520" y2="230"/>
    <line x1="680" y1="230" x2="750" y2="230"/>
  </g>

  <!-- Node 1: Cross-platform Mobile Client -->
  <g transform="translate(40, 130)">
    <rect width="160" height="200" rx="14" fill="#141c26" stroke="#00d6a0" stroke-width="1.6"/>
    <rect x="0" y="0" width="160" height="34" rx="14" fill="rgba(0,214,160,0.1)"/>
    <text x="80" y="22" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">REACT NATIVE CLIENT</text>
    <text x="80" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Mobile UI &amp; State</text>
    <text x="80" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Cross-Platform (iOS/Android)</text>
    <text x="80" y="112" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Local SQLite Cache</text>
    <text x="80" y="134" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Location Hardware API</text>
    <text x="80" y="156" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Optimistic UI Updates</text>
    <text x="80" y="180" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Background Sync Agent</text>
  </g>

  <!-- Node 2: Realtime Firestore Cloud -->
  <g transform="translate(280, 130)">
    <rect width="160" height="200" rx="14" fill="#141c26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="34" rx="14" fill="rgba(255,255,255,0.04)"/>
    <text x="80" y="22" fill="#8e9aaa" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="600">CLOUD SYNC LAYER</text>
    <text x="80" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Google Firestore</text>
    <text x="80" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Realtime Listeners</text>
    <text x="80" y="112" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Document Collections</text>
    <text x="80" y="134" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Multi-Device Sync</text>
    <text x="80" y="156" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Conflict Resolution</text>
    <text x="80" y="180" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Firebase Cloud Auth</text>
  </g>

  <!-- Node 3: AI Prioritization Engine -->
  <g transform="translate(520, 130)">
    <rect width="160" height="200" rx="14" fill="#182330" stroke="#ff9f45" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="14" fill="rgba(255,159,69,0.15)"/>
    <text x="80" y="22" fill="#ff9f45" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">AI FOCUS ANALYZER</text>
    <text x="80" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Intelligent Scoring</text>
    <text x="80" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Natural Language Parsing</text>
    <text x="80" y="112" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Priority Matrix Inference</text>
    <text x="80" y="134" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Schedule Optimization</text>
    <text x="80" y="156" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Habit Analysis</text>
    <text x="80" y="180" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Smart Daily Digest</text>
  </g>

  <!-- Node 4: Geofence & Notifications -->
  <g transform="translate(750, 130)">
    <rect width="160" height="200" rx="14" fill="#141c26" stroke="#00d6a0" stroke-width="1.6"/>
    <rect x="0" y="0" width="160" height="34" rx="14" fill="rgba(0,214,160,0.1)"/>
    <text x="80" y="22" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">LOCATION TRIGGER</text>
    <text x="80" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Geofencing &amp; Alerts</text>
    <text x="80" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Proximity Radius Triggers</text>
    <text x="80" y="112" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Low-Power Background GPS</text>
    <text x="80" y="134" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Local Push Notifications</text>
    <text x="80" y="156" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Contextual Reminders</text>
    <text x="80" y="180" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Zero Battery Drain Logic</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="380" width="870" height="54" rx="10" fill="#10151d" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="412" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="12">Key Engineering Benefit:</text>
  <text x="220" y="412" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Empowers users with proactive contextual task awareness and seamless multi-device sync with zero latency lag.</text>
</svg>
