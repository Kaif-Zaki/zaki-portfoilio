<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" fill="none">
  <rect width="960" height="480" rx="16" fill="#0d1219"/>
  <rect x="1" y="1" width="958" height="478" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Title & Metadata -->
  <text x="40" y="44" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
  <text x="40" y="68" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600">Sri Lanka Railway Seat Booking System — Segment-Based Allocation Logic</text>

  <!-- Flow Lines -->
  <g stroke="#00d6a0" stroke-width="2" opacity="0.4" stroke-dasharray="4 4">
    <line x1="160" y1="230" x2="260" y2="230"/>
    <line x1="380" y1="230" x2="460" y2="230"/>
    <line x1="580" y1="230" x2="660" y2="230"/>
    <line x1="780" y1="230" x2="840" y2="230"/>
  </g>

  <!-- Node 1: Client Layer -->
  <g transform="translate(40, 150)">
    <rect width="130" height="160" rx="12" fill="#141c26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="32" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="65" y="21" fill="#8e9aaa" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="600">CLIENT LAYER</text>
    <circle cx="65" cy="65" r="18" fill="rgba(0,214,160,0.1)" stroke="#00d6a0" stroke-width="1.5"/>
    <text x="65" y="70" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">WEB</text>
    <text x="65" y="110" fill="#edeff3" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">React UI</text>
    <text x="65" y="128" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Interactive Seat Map</text>
  </g>

  <!-- Node 2: API Gateway & Auth -->
  <g transform="translate(240, 150)">
    <rect width="140" height="160" rx="12" fill="#141c26" stroke="#00d6a0" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="12" fill="rgba(0,214,160,0.1)"/>
    <text x="70" y="21" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">API GATEWAY</text>
    <text x="70" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Express &amp; JWT</text>
    <text x="70" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Token Verification</text>
    <text x="70" y="110" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Rate Limiting</text>
    <text x="70" y="130" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Input Validation</text>
  </g>

  <!-- Node 3: Segment Booking Engine -->
  <g transform="translate(450, 130)">
    <rect width="160" height="200" rx="12" fill="#182330" stroke="#ff9f45" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="rgba(255,159,69,0.15)"/>
    <text x="80" y="22" fill="#ff9f45" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">CORE LOGIC ENGINE</text>
    <text x="80" y="64" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Segment Allocation</text>
    <text x="80" y="86" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Segment Tree Overlap Check</text>
    <line x1="20" y1="102" x2="140" y2="102" stroke="rgba(255,255,255,0.08)"/>
    <text x="80" y="122" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Non-Overlapping Logic</text>
    <text x="80" y="142" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">A-&gt;B &amp; B-&gt;C Reuse Seat</text>
    <text x="80" y="166" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">ACID Concurrency Locks</text>
  </g>

  <!-- Node 4: Prisma ORM -->
  <g transform="translate(670, 150)">
    <rect width="130" height="160" rx="12" fill="#141c26" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <rect x="0" y="0" width="130" height="32" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="65" y="21" fill="#8e9aaa" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="600">DATA ACCESS</text>
    <text x="65" y="65" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">Prisma ORM</text>
    <text x="65" y="90" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Type-safe Schema</text>
    <text x="65" y="110" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Automated Migrations</text>
    <text x="65" y="130" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Docker Containerized</text>
  </g>

  <!-- Node 5: PostgreSQL Database -->
  <g transform="translate(830, 150)">
    <rect width="100" height="160" rx="12" fill="#141c26" stroke="#00d6a0" stroke-width="1.5"/>
    <rect x="0" y="0" width="100" height="32" rx="12" fill="rgba(0,214,160,0.1)"/>
    <text x="50" y="21" fill="#00d6a0" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" font-weight="700">DATABASE</text>
    <text x="50" y="70" fill="#edeff3" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <text x="50" y="95" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Relational Tables</text>
    <text x="50" y="115" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Isolation Levels</text>
    <text x="50" y="135" fill="#ff9f45" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Indexes</text>
  </g>

  <!-- Footer Banner inside diagram -->
  <rect x="40" y="380" width="880" height="54" rx="10" fill="#10151d" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="412" fill="#8e9aaa" font-family="'Inter', sans-serif" font-size="12">Key Engineering Benefit:</text>
  <text x="220" y="412" fill="#00d6a0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Eliminated redundant empty seats across partial travel legs, increasing seat utilization by ~38% with zero double-bookings.</text>
</svg>
